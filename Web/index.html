<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Message Encoder/Decoder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔐 Secret Message Tool</h1>

    <textarea id="inputText" placeholder="Type your message here..."></textarea>

    <div class="buttons">
      <button onclick="encode()">Encode 🔁</button>
      <button onclick="decode()">Decode 🔄</button>
    </div>

    <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
  </div>

  <script src="script.js"></script>
</body>
</html>
